name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        working-directory: app
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Dependency audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Build app
        working-directory: app
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/alavo?sslmode=require
          DIRECT_URL: postgresql://user:pass@localhost:5432/alavo?sslmode=require
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci_supabase_anon_key_placeholder_xx
          SUPABASE_SERVICE_ROLE_KEY: ci_supabase_service_role_placeholder_xx
          VAPID_PUBLIC_KEY: BBjtfV3QSA78eHNE5x1TKU8-9g6Rb7xnFS5dnzWoAwgZ2EGLPKHU9uq3-VFjGcaW2nGNg-lHUgd1gxNiyAlrJoo
          VAPID_PRIVATE_KEY: Ccg0XFUEa9arXGd0sz9qnKCjPH1s8ao7Bamtw7OELbw
          VAPID_SUBJECT_EMAIL: mailto:ci@alavo.local
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: BBjtfV3QSA78eHNE5x1TKU8-9g6Rb7xnFS5dnzWoAwgZ2EGLPKHU9uq3-VFjGcaW2nGNg-lHUgd1gxNiyAlrJoo
        run: npm run build

      - name: Build website
        working-directory: website
        env:
          NEXT_PUBLIC_PRODUCT_URL: http://localhost:3000
        run: npm run build
