<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#7B08E0" />
    <title>Alavo · Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        background: #f4f4f5;
        color: #111;
        text-align: center;
        padding: 24px;
      }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-size: 1.5rem; margin: 16px 0 8px; }
      p { color: #6b6b73; margin: 0 0 20px; }
      button {
        border: 0;
        background: #7b08e0;
        color: #fff;
        border-radius: 12px;
        padding: 12px 18px;
        font-size: 14px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div>
      <img src="/icon-192.png" alt="Alavo" />
      <h1>You’re offline</h1>
      <p>Alavo will reopen as soon as you’re back online.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
